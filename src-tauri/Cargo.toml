[package]
name = "photoforge"
version = "0.14.0"
description = "A private, local-first photo restoration and enhancement tool"
authors = ["PhotoForge contributors"]
edition = "2021"
rust-version = "1.96"

[lib]
name = "photoforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# DCT-domain downscaling for JPEG. The decoder `image` uses (zune-jpeg) can only
# decode the whole frame; this one can decode at 1/2, 1/4 or 1/8 size, which is
# the only way to build a bounded preview or reduced copy of a JPEG too large to
# decode in full. It is used for that path alone; ordinary JPEGs still go
# through `image`. In maintenance mode upstream, which is weighed in
# docs/oversized-images.md.
jpeg-decoder = { version = "0.3", default-features = false }
# Plugins. The runtime is a WebAssembly engine behind the `plugins` feature, chosen
# in docs/plugin-runtime-decision.md. Only the pieces a core-module runtime needs:
# no WASI (a module is offered no filesystem, clock or network), no text format
# (`wat` is a dev-dependency for tests only), no component model.
wasmtime = { version = "=49.0.2", optional = true, default-features = false, features = [
    "cranelift",
    "runtime",
    "std",
] }
# A `.photoforge-plugin` package is a ZIP. Rather than take a general-purpose ZIP
# crate, whose attack surface is far wider than this needs, PhotoForge reads only
# stored and deflated entries with its own bounded reader (see
# docs/plugin-package.md), on top of two crates already in the graph through `png`.
miniz_oxide = "0.8"
crc32fast = "1"
png = "0.18"
# Text: shaping, bidirectional layout, system font discovery and fallback.
# Pure Rust, so no font or text DLL is packaged. swash is taken directly as
# well, for glyph outlines: PhotoForge rasterises them with its own float
# coverage rather than accepting swash's 8-bit mask, which keeps text and vector
# shapes on one rasteriser with one region-independence guarantee.
cosmic-text = "0.19"
swash = "0.2"
# Vulkan only. wgpu 30's DX12 backend does not compile in this dependency
# graph: it needs gpu-allocator 0.28, which is built against a different
# `windows` crate version than Tauri 2 resolves to, and Cargo unifies them into
# a graph where neither compiles. DX12 measured about twice Vulkan's upload
# throughput here, so this costs real performance and is recorded as such in
# docs/gpu-rendering.md rather than being papered over.
# Pure Rust ONNX inference: no native library, nothing downloaded at build
# time, and a graph format that cannot carry executable code.
tract-onnx = { version = "0.23", optional = true }
wgpu = { version = "30", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "vulkan",
    "wgsl",
] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
moxcms = { version = "=0.8.1", features = ["extended_range"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
sha2 = "0.10"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }

[dev-dependencies]
tauri = { version = "=2.11.5", features = ["test"] }
# Test fixtures for the plugin runtime are written as WebAssembly text. Production
# code reads binary modules only.
wat = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
# Already in the graph through Tauri and tao at exactly this version, so this
# adds no second copy. Used for three narrow reads and nothing else: physical
# and available memory (the resource manager's budget), this process's working
# set (to check the estimator against reality), and free disk space (the
# out-of-core and disk-cache story). No window, handle or registry access.
windows = { version = "=0.61.3", features = [
    "Win32_System_SystemInformation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

[features]
default = ["custom-protocol", "gpu", "inference", "plugins"]
custom-protocol = ["tauri/custom-protocol"]
# Canonical desktop builds include GPU support, but acceleration remains
# runtime-optional and every operation retains its CPU fallback. A deliberately
# CPU-only build is: cargo build --no-default-features --features custom-protocol.
# The wgpu graph currently requires Rust 1.90 (ordered-float via wgpu-hal).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Local neural inference. On by default so a user who brings their own model
# has a working capability; no model ships, and nothing downloads one. tract is
# pure Rust, so this adds no native DLL to the installer. It requires Rust 1.91.
inference = ["dep:tract-onnx"]
# The plugin runtime. Without it the editor is complete: documents that refer to a
# plugin still open and say which plugin they need, nothing can run one, and the
# build carries no WebAssembly engine. It requires Rust 1.96.
plugins = ["dep:wasmtime"]

# Third-party code is optimised even in dev and test builds; PhotoForge's own
# crate stays at opt-level 0 so debug assertions and overflow checks still run
# on it. Decoding a 70-megapixel PNG took 15 s with unoptimised dependencies and
# the image, compression and colour crates are exactly where the time goes; it is
# a cost paid once per dependency rebuild and repaid on every test run.
[profile.dev.package."*"]
opt-level = 2
